
name: Cancel Stuck Pages Deployment

on:
  workflow_dispatch:
    inputs:
      deployment_sha:
        description: "Commit SHA of the stuck Pages deployment"
        required: true
        default: "f96c9835fb0162ff9785546ace45f6a2108f640b"
        type: string

permissions:
  pages: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stuck Pages deployment
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.inputs.deployment_sha;

            try {
              await github.request(
                'POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel',
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pages_deployment_id: sha,
                  headers: {
                    'X-GitHub-Api-Version': '2026-03-10'
                  }
                }
              );
              core.info(`Cancellation requested for ${sha}`);
            } catch (error) {
              if (error.status === 404) {
                core.setFailed(
                  'Deployment not found. Check the SHA and Pages permissions.'
                );
              } else {
                throw error;
              }
            }
