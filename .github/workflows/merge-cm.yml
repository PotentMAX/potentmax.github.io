name: Merge CattyMod develop

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Fetch CattyMod develop
        run: |
          git fetch https://github.com/CattyMod/scratch-gui.git develop

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge CattyMod
        run: |
          git merge FETCH_HEAD --no-edit -X theirs

      - name: Push merged develop
        run: |
          git push origin develop
